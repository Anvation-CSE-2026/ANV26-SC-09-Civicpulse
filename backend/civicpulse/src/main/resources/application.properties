spring.application.name=civicpulse

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civicpulse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:prapthi}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Security / JWT
jwt.secret=${JWT_SECRET:a-long-random-secret-value-for-local-development-only-change-in-production-env}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ML Severity Prediction Service
app.ml.url=${ML_SERVICE_URL:http://localhost:8001/predict}
app.ml.enabled=${ML_ENABLED:true}
app.ml.timeout-ms=${ML_TIMEOUT_MS:3000}

# Admin Seed
app.admin.enabled=${ADMIN_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@civicpulse.local}
app.admin.password=${ADMIN_PASSWORD:AdminPass123!}
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@civicpulse.local}
app.superadmin.password=${SUPERADMIN_PASSWORD:SuperAdminPass123!}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
