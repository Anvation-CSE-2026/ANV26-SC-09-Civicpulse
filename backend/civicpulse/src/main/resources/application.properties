spring.application.name=civicpulse

spring.datasource.url=${DB_URL:jdbc:h2:mem:civicpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# Security / JWT
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-value-for-local-development}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Admin seed
app.admin.email=${ADMIN_EMAIL:admin@civicpulse.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
